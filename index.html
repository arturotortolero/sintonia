<style>
/* Concepto: televisor doméstico de 1994 a toda pantalla. Los mandos van en la propia carcasa. */
:root{
  --room:#141516; --plastic:#2c2d30; --plastic-2:#37383c; --edge:#17181a; --glass:#050606;
  --label:#b9bbbf; --dim:#7d7f85; --rubber:#4a4c51; --rubber-2:#5b5d63;
  --osd:#46f06a; --red:#d8362a; --guide:#101f78; --guide-2:#1a2f9c;
  --osd-font:"VT323","Courier New",monospace; --ui-font:"Archivo Narrow","Arial Narrow",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--room);color:var(--label);font-family:var(--ui-font);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--osd);outline-offset:2px}
.set{height:100%;display:flex;align-items:center;justify-content:center;
  padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.tv{width:100%;height:100%;min-width:0;display:flex;flex-direction:column;background:linear-gradient(170deg,var(--plastic-2),var(--plastic) 30%,#232427);
  border-radius:16px;padding:10px 10px 0;box-shadow:0 0 0 1px var(--edge),inset 0 1px 0 #55575c}
.tube{position:relative;flex:1;min-height:0;width:100%;container-type:size;background:var(--glass);border-radius:26px;overflow:hidden;box-shadow:0 0 0 3px #0c0d0e,0 0 0 5px #3f4044}
.tube:fullscreen{border-radius:0;box-shadow:none}
.frame{position:absolute;inset:0;overflow:hidden;background:#000}
.pic{position:absolute;left:50%;top:50%;width:min(100cqw,177.78cqh);aspect-ratio:16/9;transform:translate(-50%,-50%)}
.frame.zoom .pic{width:max(100cqw,177.78cqh)}
.pic iframe,#player{position:absolute;inset:0;width:100%;height:100%;border:0}
#static,.osd,.glass{position:absolute;pointer-events:none}
.glass{opacity:1;inset:0;z-index:4;border-radius:inherit;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.1) 0 1px,transparent 1px 3px),radial-gradient(120% 90% at 28% 12%,rgba(255,255,255,.08),transparent 45%);
  box-shadow:inset 0 0 70px rgba(0,0,0,.6)}
#static{inset:0;width:100%;height:100%;opacity:0;image-rendering:pixelated}
#static.on{opacity:1}
.osd{inset:0;padding:6%;font-family:var(--osd-font);color:var(--osd);text-shadow:2px 2px 0 #021;display:flex;flex-direction:column;justify-content:space-between;opacity:0}
.osd.on{opacity:1}
.osd .num{align-self:flex-end;font-size:clamp(40px,7vw,76px);line-height:.9}
.osd .info{font-size:clamp(19px,2.5vw,28px);line-height:1.05;max-width:85%;margin-bottom:7%}
.osd .name{display:block}
.off{position:absolute;inset:0;z-index:3;background:radial-gradient(circle at 50% 50%,#101312,#040505);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:9%}
.off[hidden]{display:none}
.off .now{font-family:var(--osd-font);font-size:clamp(18px,2.4vw,24px);color:#6f8a76;max-width:28em;line-height:1.1}
.off .now b{color:var(--osd);font-weight:400}
.power-big{font-family:var(--osd-font);font-size:30px;color:var(--osd);border:2px solid var(--osd);padding:6px 26px;border-radius:3px}
.power-big:hover{background:var(--osd);color:#021}
.tv.warm .frame{animation:warm .5s cubic-bezier(.2,.8,.2,1)}
@keyframes warm{0%{transform:scale(.02,.006);filter:brightness(5)}45%{transform:scale(1,.012);filter:brightness(4)}100%{transform:none;filter:none}}
.guide{position:absolute;inset:0;z-index:2;background:var(--guide);font-family:var(--osd-font);color:#fff;display:flex;flex-direction:column;font-size:clamp(19px,2.4vw,26px);overflow:auto;padding:4% 5%}
.guide[hidden]{display:none}
.guide header{display:flex;justify-content:space-between;gap:12px;padding:6px 10px;color:var(--osd)}
.guide button.row{display:grid;grid-template-columns:2.6em minmax(0,1fr);gap:0 10px;text-align:left;padding:8px 10px;border-top:2px solid var(--guide-2);width:100%;line-height:1.05}
.guide button.row:hover,.guide button.row.cur{background:var(--guide-2)}
.row .n{color:var(--osd);font-size:1.4em;grid-row:span 3}
.row .t{color:var(--osd)}
.row .sub{opacity:.75;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
/* Barbilla con los mandos del aparato */
.chin{min-height:50px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;padding-block:6px;transition:opacity 1s}
.badge{font-size:14px;font-weight:600;letter-spacing:.34em;color:var(--label)}
.ctrl{display:flex;flex-wrap:wrap;justify-content:center;gap:5px}
.status{display:flex;align-items:center;justify-content:flex-end;gap:10px;font-size:10px;letter-spacing:.14em;color:var(--dim)}
.led{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 7px var(--red)}
.set.on .led{background:var(--osd);box-shadow:0 0 7px var(--osd)}
.k{min-width:36px;min-height:32px;padding:0 8px;border-radius:6px;background:var(--rubber);box-shadow:inset 0 -2px 0 #0006,0 1px 0 #0008;font-size:12px;font-weight:600;color:#e6e7e9;letter-spacing:.03em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.k{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.k:hover{background:var(--rubber-2)}
.k:active{transform:translateY(1px);box-shadow:none}
.k.lit{color:var(--osd)}
.k.pw{background:var(--red);color:#fff}
.set.night .chin{opacity:.4}
.set.night .chin:hover,.set.night .chin:focus-within{opacity:1}
@media (max-aspect-ratio:1/1){
  .tv{height:auto;padding:8px 8px 0}
  .tube{flex:none;aspect-ratio:16/9;border-radius:14px;height:auto}
  .chin{grid-template-columns:minmax(0,1fr) auto}
  .ctrl{grid-column:1/-1;grid-row:2}
}
@media (max-width:900px) and (min-aspect-ratio:1/1){
  .chin{grid-template-columns:minmax(0,1fr);min-height:0;padding-block:4px}
  .chin{grid-template-columns:minmax(0,1fr) auto}
  .badge,.status span{display:none}
  .k{min-height:28px;font-size:11px;padding:0 6px}
}
/* Modo cine: pantalla completa propia para el iPhone, que no permite la del navegador */
.cine-keys{display:none;position:absolute;z-index:5;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));flex-direction:column;gap:6px}
.cine-keys .k{opacity:.45;min-height:36px}
.cine-keys .k.lit{opacity:1}
.cine-ch{left:auto;right:max(10px,env(safe-area-inset-right));top:50%;transform:translateY(-50%)}
.set.cine{padding:0}
.set.cine .tv{position:fixed;inset:0;z-index:10;width:auto;height:auto;padding:0;border-radius:0;background:#000;box-shadow:none}
.set.cine .tube{flex:1;aspect-ratio:auto;height:100%;border-radius:0;box-shadow:none}
.set.cine .chin{display:none}
.set.cine .cine-keys{display:flex}
@media (max-aspect-ratio:1/1){
  .set.cine .tv{inset:auto;left:50%;top:50%;width:100dvh;height:100dvw;transform:translate(-50%,-50%) rotate(90deg)}
}
@media (prefers-reduced-motion:reduce){.tv.warm .frame{animation:none}}
</style>
</head>
<body>
<div class="set" id="set">
    <div class="tv" id="tube">
      <div class="tube">
        <div class="frame" id="frame">
          <div class="pic"><div id="player"></div></div>
          <canvas id="static" width="160" height="120" aria-hidden="true"></canvas>

        <div class="guide" id="guide" hidden></div>
        <div class="off" id="off"><div class="now" id="offNow"></div><button class="power-big" id="powerBig">ENCENDER</button></div>
        <div class="glass"></div>
        <div class="cine-keys">
          <button class="k" id="cineExit" aria-label="Salir de pantalla completa">✕</button>

          <button class="k" id="cineUp" aria-label="Canal siguiente">CH +</button>
          <button class="k" id="cineDown" aria-label="Canal anterior">CH −</button>
        </div>
      </div>
      <div class="chin">
        <div class="badge">SINTONÍA</div>
        <div class="ctrl">
          <button class="k" id="volDown" aria-label="Bajar volumen">Vol −</button>
          <button class="k" id="volUp" aria-label="Subir volumen">Vol +</button>
          <button class="k mute" id="muteBtn" aria-pressed="false">Mute</button>
          <button class="k" id="guideBtn">Guía</button>
          <button class="k" id="zoomBtn">Zoom</button>
          <a class="k yt" id="ytBtn" href="https://www.youtube.com/" target="_blank" rel="noopener" aria-label="Ver este vídeo en YouTube">YouTube</a>
          <button class="k" id="sleepBtn">Sleep</button>
          <button class="k" id="fullBtn" aria-label="Pantalla completa">⛶</button>
          <button class="k pw" id="powerBtn" aria-label="Encender o apagar">⏻</button>
        </div>
        <div class="status"><span>STEREO</span><i class="led"></i>
          <button class="k" id="chDown" aria-label="Canal anterior">CH −</button>
          <button class="k" id="chUp" aria-label="Canal siguiente">CH +</button>
        </div>
      </div>
    </div>
</div>

const EPOCH = Date.UTC(2026,0,1)/1000;
const DIM_SECONDS = 60;

/* Posición de emisión: mismo instante, mismo punto del vídeo. */
function onAir(items, nowSec){
  const total = items.reduce((s,v)=>s+v.s,0);
  let t = ((nowSec-EPOCH)%total+total)%total;
  for(let i=0;i<items.length;i++){ if(t<items[i].s) return {index:i,offset:Math.floor(t)}; t-=items[i].s; }
  return {index:0,offset:0};
}
function defaultChannel(hour){
  const i = CHANNELS.findIndex(c=>{const [a,b]=c.hours; return a<b ? hour>=a&&hour<b : hour>=a||hour<b;});
  return i<0?0:i;
}
if(typeof module!=="undefined"){ module.exports={onAir,defaultChannel,CHANNELS}; }

<script>

window.onYouTubeIframeAPIReady=()=>{

fetch("data.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{
  if(!d) return;
  CHANNELS.forEach(c=>{ const x=d[c.num]; if(x) Object.assign(c,x); });
}).catch(()=>{});

function hasRecap(c){ return !!(c.recap&&c.recap.length); }
function latestList(c){
  const id=hasRecap(c)?c.ids[0]:c.ids[turn%c.ids.length];
  return (stage===0?"UULF":"UU")+id.slice(2);
}
function play(){
  const c=CHANNELS[cur]; playing=false;
  if(c.kind==="latest"){
    const every=hasRecap(c)?2:c.ids.length, round=Math.floor(turn/every);
    if(hasRecap(c)&&turn%2===0) player.loadVideoById(c.recap[round%c.recap.length]);
    else player.loadPlaylist({list:latestList(c),listType:"playlist",index:round});
  }else if(c.kind==="episodes"){
    player.loadVideoById({videoId:c.items[turn%c.items.length].id,startSeconds:0});
  }else{
    const a=onAir(c.items,nowSec()); item=a.index;
    player.loadVideoById({videoId:c.items[item].id,startSeconds:a.offset});
  }
}
function nextUp(){
  const c=CHANNELS[cur]; if(Date.now()<busy) return; busy=Date.now()+3000;
  if(c.kind!=="linear"){ turn++; stage=0; play(); }
  else{ item=(item+1)%c.items.length; player.loadVideoById({videoId:c.items[item].id,startSeconds:0}); }
}
function onState(e){
  if(!isOn) return;
  if(e.data===YT.PlayerState.PLAYING){ playing=true; failures=0; const d=player.getVideoData(); if(d&&d.title) flashOsd(d.title); }

}
function onError(){

  busy=0; nextUp();
}
/* Cambia antes del final para no ver la pantalla de sugerencias. */
setInterval(()=>{
  if(!isOn||!ready) return;

    const d=player.getDuration(),t=player.getCurrentTime();
    if(d>10&&t>=d-1.5) nextUp();

/* El efecto de tubo se atenúa durante un minuto en cada encendido o cambio de canal. */
function crtFade(){

}

}

const cv=$("static"),cx=cv.getContext("2d");

function clack(){

  o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.1);
  const n=audio.createBufferSource(),b=audio.createBuffer(1,audio.sampleRate*.4,audio.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;

  h.gain.setValueAtTime(.05,t+.02);h.gain.exponentialRampToValueAtTime(.001,t+.4);
  n.buffer=b;n.connect(f).connect(h).connect(audio.destination);n.start(t+.02);
}

function powerOn(){

}
function powerOff(){
  isOn=false; $("set").classList.remove("on"); if(ready) player.stopVideo();

function showOff(msg){

function nowText(c){ return c.kind!=="linear"?c.tagline:c.items[onAir(c.items,nowSec()).index].t; }

/* --- Dial y guía --- */
function paintDial(){
  document.querySelectorAll("[data-d]").forEach(b=>b.classList.toggle("cur",+b.dataset.d===+CHANNELS[cur].num));
}
function press(n){
  const i=CHANNELS.findIndex(c=>+c.num===n);
  if(i<0){ if(isOn) noSignal(n); return; }
  if(isOn) tune(i); else { cur=i; paintDial(); showOff(); }
}
function noSignal(n){
  burst(); clack();
  $("osdNum").textContent=String(n).padStart(2,"0"); $("osdName").textContent="SIN SEÑAL"; $("osdTitle").textContent="";
  $("osd").classList.add("on"); clearTimeout(osdTimer); osdTimer=setTimeout(()=>$("osd").classList.remove("on"),1800);
}
function fmtClock(sec){return new Date(sec*1000).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});}
function renderGuide(){
  const g=$("guide");g.innerHTML="";
  const h=document.createElement("header");
  h.innerHTML=`<span>GUÍA</span><span>${fmtClock(nowSec())}</span>`;g.append(h);
  CHANNELS.forEach((c,i)=>{
    const b=document.createElement("button");b.className="row"+(i===cur?" cur":"");
    const n=document.createElement("span");n.className="n";n.textContent=c.num;
    const t=document.createElement("span");t.className="t";t.textContent=c.name;
    const s=document.createElement("span");s.className="sub";
    const s2=document.createElement("span");s2.className="sub";
    if(c.kind!=="linear"){s.textContent="Ahora: "+c.tagline;s2.textContent=c.sourceName;}
    else{
      const a=onAir(c.items,nowSec()),v=c.items[a.index],nx=c.items[(a.index+1)%c.items.length];
      s.textContent="Ahora: "+v.t;
      s2.textContent=fmtClock(nowSec()+v.s-a.offset)+" · "+nx.t;
    }
    b.append(n,t,s,s2);b.onclick=()=>{if(isOn)tune(i);else{cur=i;paintDial();powerOn();}g.hidden=true;};g.append(b);
  });
}
function toggleGuide(){const g=$("guide");if(g.hidden){renderGuide();g.hidden=false;}else g.hidden=true;}

function paintSleep(){
  const b=$("sleepBtn");
  if(!sleepAt){b.textContent="Sleep";b.classList.remove("lit");return;}
  b.textContent=Math.ceil((sleepAt-Date.now())/60000)+"′";b.classList.add("lit");
}
function cycleSleep(){
  sleepStep=(sleepStep+1)%SLEEP.length;
  sleepAt=SLEEP[sleepStep]?Date.now()+SLEEP[sleepStep]*60000:0;
  if(ready) player.setVolume(vol); paintSleep();
}
function setVol(d){vol=Math.max(0,Math.min(100,vol+d));muted=false;paintMute();if(ready){player.unMute();player.setVolume(vol);}
  $("osdNum").textContent="";$("osdName").textContent="VOL "+"|".repeat(Math.round(vol/5));$("osdTitle").textContent="";
  $("osd").classList.add("on");clearTimeout(osdTimer);osdTimer=setTimeout(()=>$("osd").classList.remove("on"),1500);}

/* --- Controles --- */
$("zoomBtn").onclick=()=>$("frame").classList.toggle("zoom");
function toggleFull(){
  const t=document.querySelector(".tube");
  if(!t.requestFullscreen){ $("set").classList.toggle("cine"); return; }
  try{ const p=document.fullscreenElement?document.exitFullscreen():t.requestFullscreen(); if(p&&p.catch)p.catch(()=>{}); }catch(e){}
}
$("cineExit").onclick=()=>$("set").classList.remove("cine");
$("cineUp").onclick=()=>isOn&&tune(cur+1);$("cineDown").onclick=()=>isOn&&tune(cur-1);$("cineGuide").onclick=toggleGuide;
$("fullBtn").onclick=toggleFull;
/* Abre el vídeo actual en YouTube por el mismo punto y pausa la tele. Al volver, sigue. */
let leftForYT=false;
document.querySelectorAll(".yt").forEach(a=>a.addEventListener("click",e=>{
  const d=ready&&isOn?player.getVideoData():null;
  if(!d||!d.video_id){ e.preventDefault(); return; }
  a.href="https://youtu.be/"+d.video_id+"?t="+Math.floor(player.getCurrentTime()||0);
  leftForYT=true; player.pauseVideo();
}));
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"&&leftForYT){ leftForYT=false; if(isOn&&ready) player.playVideo(); }
});
$("chUp").onclick=()=>isOn&&tune(cur+1);$("chDown").onclick=()=>isOn&&tune(cur-1);
function paintMute(){document.querySelectorAll(".mute").forEach(b=>{b.classList.toggle("lit",muted);b.setAttribute("aria-pressed",muted);});}
function toggleMute(){
  if(!ready) return;
  muted=!muted; if(muted) player.mute(); else player.unMute();
  paintMute();
  $("osdNum").textContent="";$("osdName").textContent=muted?"SILENCIO":"SONIDO";$("osdTitle").textContent="";
  $("osd").classList.add("on");clearTimeout(osdTimer);osdTimer=setTimeout(()=>$("osd").classList.remove("on"),1500);
}
document.querySelectorAll(".mute").forEach(b=>b.onclick=toggleMute);
$("volUp").onclick=()=>setVol(5);$("volDown").onclick=()=>setVol(-5);
$("guideBtn").onclick=toggleGuide;$("sleepBtn").onclick=cycleSleep;
$("powerBig").onclick=powerOn;$("powerBtn").onclick=()=>isOn?powerOff():powerOn();
addEventListener("keydown",e=>{
  if(e.key==="ArrowUp"&&isOn){e.preventDefault();tune(cur+1);}
  if(e.key==="ArrowDown"&&isOn){e.preventDefault();tune(cur-1);}
  if(e.key==="ArrowRight"){setVol(5);}
  if(e.key==="ArrowLeft"){setVol(-5);}
  if(e.key==="g"||e.key==="G")toggleGuide();
  if(e.key==="m"||e.key==="M")toggleMute();
  if(e.key==="f"||e.key==="F")toggleFull();
  if(/^[1-9]$/.test(e.key))press(+e.key);
  if(e.key==="z"||e.key==="Z")$("frame").classList.toggle("zoom");
  if(e.key==="Escape"){$("guide").hidden=true;$("set").classList.remove("cine");}
  if(e.key===" "&&document.activeElement===document.body){e.preventDefault();isOn?powerOff():powerOn();}
});
addEventListener("resize",paintDial);
cur=defaultChannel(new Date().getHours());paintDial();showOff();
$("set").classList.toggle("night",!!CHANNELS[cur].night);
window.__tv={tune,state:()=>({cur,item,stage,turn,isOn,ready,playing,yt:player&&player.getPlayerState&&player.getPlayerState(),title:player&&player.getVideoData&&player.getVideoData().title,vid:player&&player.getVideoData&&player.getVideoData().video_id,t:player&&player.getCurrentTime&&player.getCurrentTime()})};
</script>
</body>
</html>
