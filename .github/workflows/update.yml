name: Actualizar canales
on:
  schedule:
    - cron: "37 4 * * *"
  push:
    branches: [main]
    paths: [canales.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: actualizar
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/update.py
      - run: |
          git config user.name "sintonia-bot"
          git config user.email "actions@users.noreply.github.com"
          # Si otro cambio llega mientras tanto, se recalcula sobre la versión nueva en lugar de mezclar.
          for intento in 1 2 3; do
            git add data.json
            git diff --cached --quiet && exit 0
            git commit -m "Actualiza listas"
            git push && exit 0
            git fetch origin main && git reset --hard origin/main
            python3 scripts/update.py
          done
          exit 1
