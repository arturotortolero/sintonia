name: Actualizar canales
on:
  schedule:
    - cron: "37 4 * * *"
  push:
    branches: [main]
    paths: [canales.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: actualizar
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update.py
      - run: |
          git config user.name "sintonia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Actualiza listas" && git pull --rebase origin main && git push)
